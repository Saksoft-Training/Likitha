<div *ngIf="selectedMovie; else noSelection">
  <h2>{{ selectedMovie.title }}</h2>
  <img *ngIf="selectedMovie.poster" [src]="selectedMovie.poster" alt="Poster" width="200" />
  <p>{{ selectedMovie.description }}</p>
  <p>Release Date: {{ selectedMovie.releaseDate }}</p>
  <p>Languages: {{ selectedMovie.languages }}</p>
  <p>Genres: {{ selectedMovie.genres }}</p>
  <p>Status: {{ selectedMovie.status }}</p>
</div>

<ng-template #noSelection>
  <p>Select a movie to see details.</p>
</ng-template>
