<div class="left">
    <div *ngFor="let movie of movies; let i = index" (click)="goToDetails(i)">
        <img [src]="movie.poster" alt="{{movie.title}}"><br>
        <span>{{movie.title}}</span>
        <span>{{movie.genres}}</span>

    </div>
</div>
