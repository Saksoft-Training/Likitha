<form [formGroup]="movieForm">
    <label>Title</label>
    <input type="text" formControlName="title"
    [ngClass]="{'invalid': movieForm.get('title')?.invalid && movieForm.get('title')?.touched}"
    [appAppHighlight]="'#f5faff'">

    <label>Description</label>
    <textarea formControlName="description" [appAppHighlight]="'#f5faff'"></textarea>

    <label>Release Date</label>
    <input type="date" formControlName="releaseDate" [appAppHighlight]="'#f5faff'">

    <label>Languages</label>
    <select formControlName="languages" [appAppHighlight]="'#f5faff'">
        <option value="Kannada">Kannada</option>
        <option value="Telugu">Telugu</option>
        <option value="Tamil">Tamil</option>
        <option value="Malayalam">Malayalam</option>
        <option value="Hindi">Hindi</option>
    </select>

    <label>Genres</label>
    <select formControlName="genres" [appAppHighlight]="'#f5faff'">
        <option value="Action">Action</option>
        <option value="Comedy">Comedy</option>
        <option value="Drama">Drama</option>
        <option value="Fantasy">Fantasy</option>
        <option value="Horror">Horror</option>
    </select>

    <label>Duration</label>
    <input type="time" formControlName="duration" [appAppHighlight]="'#f5faff'">

    <label>Director</label>
    <input type="text" formControlName="director" [appAppHighlight]="'#f5faff'">

    <label>Cast</label>
    <div formArrayName="cast">
        <div *ngFor="let member of castMembers.controls; let i=index">
            <input type="text" [formControlName]="i" placeholder="Cast Member Name" [appAppHighlight]="'#f5faff'">
            <button type="button" (click)="removeCastMember(i)">Remove</button>
        </div>
    </div>
    <button type="button" (click)="addCastMember()">Add Cast Member</button>

    <label>Poster</label>
    <input type="url" formControlName="poster" [appAppHighlight]="'#f5faff'">

    <label>Status</label>
    <select formControlName="status" [appAppHighlight]="'#f5faff'">
        <option value="upcoming">Coming Soon</option>
        <option value="released">Released</option>
    </select>

    <button type="submit"  (click)="onSubmit()">Add Movie</button>
    <button type="button" (click)="onReset()">Reset</button>
</form>
